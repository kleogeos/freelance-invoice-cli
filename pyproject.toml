[project]
name = "freelance-invoice-cli"
version = "1.0.0"
description = "Generate a clean HTML invoice from a JSON file. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "kleogeos", email = "kleogeos@gmail.com"}]
keywords = ["freelance", "invoice", "invoice-generator", "html", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/kleogeos/freelance-invoice-cli"
Repository = "https://github.com/kleogeos/freelance-invoice-cli"

[project.scripts]
freelance-invoice = "invoice:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["invoice"]
